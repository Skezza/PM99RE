<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PM99 v86 Backend</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111412;
        --panel: #1b211d;
        --panel-2: #222922;
        --text: #edf2ee;
        --muted: #aab6ad;
        --line: #3b443d;
        --accent: #d6b25e;
        --accent-2: #7fb39a;
        --danger: #e07b69;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.4;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        min-height: 100vh;
      }

      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 18px;
      }

      .stage {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 100vh;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 20px;
        font-weight: 650;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      select,
      input[type="file"],
      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
      }

      select,
      input[type="file"] {
        padding: 7px 9px;
      }

      button {
        cursor: pointer;
        font-weight: 650;
      }

      button.primary {
        border-color: #b89448;
        background: var(--accent);
        color: #171308;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .button-grid .wide {
        grid-column: 1 / -1;
      }

      .status {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #131815;
        min-height: 72px;
        padding: 10px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .profile {
        margin-top: 14px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        background: #171b18;
      }

      .topbar strong {
        font-size: 14px;
      }

      .indicator {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .indicator.running {
        border-color: var(--accent-2);
        color: var(--accent-2);
      }

      .screen-shell {
        min-width: 0;
        min-height: 0;
        padding: 16px;
      }

      #screen_container {
        width: 100%;
        height: 100%;
        min-height: 420px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #050605;
      }

      #screen_container .vga-text {
        white-space: pre;
        font: 14px "Cascadia Mono", "Liberation Mono", monospace;
        line-height: 14px;
      }

      #screen_container canvas {
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
      }

      .log {
        max-height: 144px;
        overflow: auto;
        border-top: 1px solid var(--line);
        background: #151a16;
        padding: 10px 16px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .stage {
          min-height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>PM99 v86 Backend</h1>

        <label for="profile_select">Profile</label>
        <select id="profile_select"></select>

        <div class="button-grid">
          <button id="launch_button" class="primary wide" type="button">Launch</button>
          <button id="stop_button" type="button" disabled>Stop</button>
          <button id="reset_button" type="button" disabled>Reset</button>
          <button id="fullscreen_button" type="button" disabled>Fullscreen</button>
          <button id="save_state_button" type="button" disabled>Save State</button>
        </div>

        <label for="restore_state_input">Restore State</label>
        <input id="restore_state_input" type="file" accept=".bin,.state,.v86state,application/octet-stream" disabled>

        <label for="cdrom_input">CD-ROM</label>
        <input id="cdrom_input" type="file" accept=".iso,.img,.bin,application/octet-stream" disabled>

        <label>Status</label>
        <div id="status" class="status">Idle</div>

        <label>Config</label>
        <div id="profile_summary" class="status profile"></div>
      </aside>

      <section class="stage" aria-label="v86 emulator">
        <div class="topbar">
          <strong id="active_profile">No profile loaded</strong>
          <span id="run_indicator" class="indicator">stopped</span>
        </div>
        <div class="screen-shell">
          <div id="screen_container">
            <div class="vga-text"></div>
            <canvas></canvas>
          </div>
        </div>
        <div id="event_log" class="log"></div>
      </section>
    </main>

    <script type="module" src="js/v86-launcher.js"></script>
  </body>
</html>
